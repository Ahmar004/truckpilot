[project]
name = "truckpilot-backend"
version = "0.1.0"
description = "Truck Pilot API (Django + Django Ninja)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.7.3",
    "google-auth>=2.62.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "sentry-sdk>=2.73.0",
    "timezonefinder>=9.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "truckpilot.settings_test"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".vercel"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truck Pilot</title>
    <script>
      // Set the theme before first paint so nothing flashes (design 3.5). Blocked storage means light.
      try {
        if (localStorage.getItem('tp-theme') === 'dark')
          document.documentElement.classList.add('dark')
      } catch {
        // light theme
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
